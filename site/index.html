<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>carillon</title>
<meta name="robots" content="noindex"/>
<link rel="canonical" href="https://carillon-psi.vercel.app/"/>
<!-- This used to be a separate cream-and-serif landing page describing the
     app: a static table of the checks verify.mjs runs, and three paragraphs
     of method. Everything on it now lives on the app page itself, and lives
     there better — the app shows the live Performance-timeline measurement
     rather than a table asserting the checks passed, and it shows the
     quantization happening rather than describing it.

     Two surfaces with two different visual identities for one small tool is
     worse than one surface, so this redirects. It is kept (rather than
     deleted) because /site has been a public URL, and a link that has
     existed should not start answering 404. -->
<meta http-equiv="refresh" content="0; url=../index.html"/>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; gap: 1rem;
    background: #090b10; color: #eef1f7;
    font-family: ui-sans-serif, system-ui, "Segoe UI Variable Display", "Segoe UI",
                 Roboto, -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center; padding: 2rem;
  }
  p { margin: 0; color: #a2abbf; font-size: 0.9375rem; }
  .eyebrow {
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase; color: #6d7688;
  }
  a {
    display: inline-block; margin-top: 0.5rem;
    background: linear-gradient(180deg, #f7c85c, #f0b429);
    color: #2a1c02; font-weight: 650; text-decoration: none;
    border-radius: 8px; padding: 0.65rem 1.1rem; min-height: 44px;
    box-shadow: inset 0 1px 0 hsl(0 0% 100% / 20%), 0 4px 12px -4px hsl(222 60% 3% / 60%);
  }
  a:focus-visible { outline: 2px solid #f0b429; outline-offset: 2px; }
</style>
</head>
<body>
  <p class="eyebrow">carillon</p>
  <p>This page has moved to the app itself.</p>
  <a href="../index.html">Open carillon</a>
</body>
</html>
